identity:
  name: get_transaction
  author: sochain
  label:
    en_US: Get Transaction
description:
  human:
    en_US: "One transaction with its inputs, outputs, fee and confirmations."
  llm: "Get a Bitcoin, Litecoin, Dogecoin or Zcash transaction by its ID: confirmations, block, time, fee, size, and every input and output with its address and value."
parameters:
  - name: network
    type: select
    required: true
    form: llm
    default: BTC
    label:
      en_US: Network
    human_description:
      en_US: BTC, LTC, DOGE or ZEC, or a testnet (BTCTEST is Bitcoin testnet4).
    llm_description: "Network code: BTC (Bitcoin), LTC (Litecoin), DOGE (Dogecoin), ZEC (Zcash), or a testnet: BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST, ZECTEST."
    options:
      - value: BTC
        label:
          en_US: Bitcoin
      - value: LTC
        label:
          en_US: Litecoin
      - value: DOGE
        label:
          en_US: Dogecoin
      - value: ZEC
        label:
          en_US: Zcash
      - value: BTCTEST
        label:
          en_US: Bitcoin testnet4
      - value: LTCTEST
        label:
          en_US: Litecoin testnet
      - value: DOGETEST
        label:
          en_US: Dogecoin testnet
      - value: ZECTEST
        label:
          en_US: Zcash testnet
  - name: tx_hash
    type: string
    required: true
    form: llm
    label:
      en_US: Transaction ID
    human_description:
      en_US: The transaction ID (64 hex characters).
    llm_description: The transaction ID (txid), 64 hex characters.
extra:
  python:
    source: tools/get_transaction.py
