identity:
  name: get_address_transactions
  author: sochain
  label:
    en_US: Get Address Transactions
description:
  human:
    en_US: "An address's transactions, ten per page, newest first."
  llm: "List the transactions of a Bitcoin, Litecoin, Dogecoin or Zcash address, ten per page, unconfirmed first then newest first. Each has its hash, block, time, value sent, value received and balance change."
parameters:
  - name: network
    type: select
    required: true
    form: llm
    default: BTC
    label:
      en_US: Network
    human_description:
      en_US: BTC, LTC, DOGE or ZEC, or a testnet (BTCTEST is Bitcoin testnet4).
    llm_description: "Network code: BTC (Bitcoin), LTC (Litecoin), DOGE (Dogecoin), ZEC (Zcash), or a testnet: BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST, ZECTEST."
    options:
      - value: BTC
        label:
          en_US: Bitcoin
      - value: LTC
        label:
          en_US: Litecoin
      - value: DOGE
        label:
          en_US: Dogecoin
      - value: ZEC
        label:
          en_US: Zcash
      - value: BTCTEST
        label:
          en_US: Bitcoin testnet4
      - value: LTCTEST
        label:
          en_US: Litecoin testnet
      - value: DOGETEST
        label:
          en_US: Dogecoin testnet
      - value: ZECTEST
        label:
          en_US: Zcash testnet
  - name: address
    type: string
    required: true
    form: llm
    label:
      en_US: Address
    human_description:
      en_US: The address to look up.
    llm_description: The address to look up, in full.
  - name: page
    type: number
    required: false
    form: llm
    default: 1
    min: 1
    label:
      en_US: Page
    human_description:
      en_US: Page number from 1; ten transactions per page.
    llm_description: Page number from 1, ten transactions per page, newest first. Default 1.
extra:
  python:
    source: tools/get_address_transactions.py
