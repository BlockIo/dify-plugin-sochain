identity:
  name: get_network_info
  author: sochain
  label:
    en_US: Get Network Info
description:
  human:
    en_US: "Newest block, hashrate, mempool and projected fee rates of a network."
  llm: "Get the state of the Bitcoin, Litecoin, Dogecoin or Zcash network: newest block, hashrate, mempool size and the next projected blocks with their fee rates. Use it to estimate the fee a transaction needs."
parameters:
  - name: network
    type: select
    required: true
    form: llm
    default: BTC
    label:
      en_US: Network
    human_description:
      en_US: BTC, LTC, DOGE or ZEC, or a testnet (BTCTEST is Bitcoin testnet4).
    llm_description: "Network code: BTC (Bitcoin), LTC (Litecoin), DOGE (Dogecoin), ZEC (Zcash), or a testnet: BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST, ZECTEST."
    options:
      - value: BTC
        label:
          en_US: Bitcoin
      - value: LTC
        label:
          en_US: Litecoin
      - value: DOGE
        label:
          en_US: Dogecoin
      - value: ZEC
        label:
          en_US: Zcash
      - value: BTCTEST
        label:
          en_US: Bitcoin testnet4
      - value: LTCTEST
        label:
          en_US: Litecoin testnet
      - value: DOGETEST
        label:
          en_US: Dogecoin testnet
      - value: ZECTEST
        label:
          en_US: Zcash testnet
extra:
  python:
    source: tools/get_network_info.py
