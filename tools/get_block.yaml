identity:
  name: get_block
  author: sochain
  label:
    en_US: Get Block
description:
  human:
    en_US: "One block by height or hash."
  llm: "Get a Bitcoin, Litecoin, Dogecoin or Zcash block by height or hash: time, confirmations, transaction count, size, reward, fees, fee rates and value out."
parameters:
  - name: network
    type: select
    required: true
    form: llm
    default: BTC
    label:
      en_US: Network
    human_description:
      en_US: BTC, LTC, DOGE or ZEC, or a testnet (BTCTEST is Bitcoin testnet4).
    llm_description: "Network code: BTC (Bitcoin), LTC (Litecoin), DOGE (Dogecoin), ZEC (Zcash), or a testnet: BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST, ZECTEST."
    options:
      - value: BTC
        label:
          en_US: Bitcoin
      - value: LTC
        label:
          en_US: Litecoin
      - value: DOGE
        label:
          en_US: Dogecoin
      - value: ZEC
        label:
          en_US: Zcash
      - value: BTCTEST
        label:
          en_US: Bitcoin testnet4
      - value: LTCTEST
        label:
          en_US: Litecoin testnet
      - value: DOGETEST
        label:
          en_US: Dogecoin testnet
      - value: ZECTEST
        label:
          en_US: Zcash testnet
  - name: block
    type: string
    required: true
    form: llm
    label:
      en_US: Block
    human_description:
      en_US: Block height (for example 840000) or block hash.
    llm_description: Block height (for example 840000) or the 64 hex character block hash.
  - name: include_transactions
    type: boolean
    required: false
    form: form
    default: false
    label:
      en_US: Include Transaction IDs
    human_description:
      en_US: Also return every transaction ID in the block. A block can hold thousands.
extra:
  python:
    source: tools/get_block.py
